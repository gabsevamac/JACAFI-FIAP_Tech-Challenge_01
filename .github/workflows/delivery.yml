name: delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jacafi-tech

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  package:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: package
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-kubectl@v4
      - name: Provision local infrastructure
        working-directory: infra
        env:
          TF_VAR_database_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_database_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve
      - name: Deploy API
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/infra/kubeconfig"
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name jacafi-tech
          kubectl apply -k k8s
          kubectl -n jacafi set image deployment/tech-api tech-api="$IMAGE"
          kubectl -n jacafi rollout status deployment/tech-api --timeout=180s
