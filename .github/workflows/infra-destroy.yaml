name: Derrubar ambiente AWS
#===============
# TRIGGER
#===============
# Manual (com confirmação) e todo dia à meia-noite de Brasília (03:00 UTC), para o ambiente não ficar
# ligado esquecido consumindo créditos. O bootstrap (bucket, OIDC, ECR) não é afetado.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite DESTRUIR para remover EKS, RDS e ALB"
        required: true
  schedule:
    - cron: "0 3 * * *"

env:
  TERRAFORM_VERSION: "1.17.1"
  EKS_CLUSTER_NAME: "jacafi-eks"

permissions:
  contents: read

jobs:
  destroy:
    name: Destruir ambiente (Terraform)
    if: vars.AWS_ROLE_ARN != '' && (github.event_name == 'schedule' || inputs.confirmacao == 'DESTRUIR')
    runs-on: ubuntu-latest
    concurrency:
      group: aws-environment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_cluster_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: Verificar se há recursos
        id: state
        run: |
          if [ -n "$(terraform state list)" ]; then
            echo "has_resources=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_resources=false" >> "$GITHUB_OUTPUT"
            echo "::notice::O ambiente já está desligado; nada para destruir."
          fi

      - name: Terraform Destroy
        if: steps.state.outputs.has_resources == 'true'
        run: terraform destroy -auto-approve -var="cluster_name=$EKS_CLUSTER_NAME"
