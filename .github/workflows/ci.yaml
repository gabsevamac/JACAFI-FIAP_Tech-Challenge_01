name: Fluxo CI/CD
#===============
# TRIGGER
#===============
# push na main: CI, publica a imagem e atualiza o ambiente AWS se ele estiver no ar.
# workflow_dispatch na main: CI e sobe (ou atualiza) o ambiente AWS completo.
# pull_request: somente CI, sem credenciais da AWS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  JAVA_VERSION: "25"
  IMAGE_NAME: "jacafi/server:${{ github.sha }}"
  TERRAFORM_VERSION: "1.17.1"
  KUBECTL_VERSION: "v1.36.6"
  EKS_CLUSTER_NAME: "jacafi-eks"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{  env.JAVA_VERSION  }}
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "server/pom.xml"

      - name: Make Maven Wrapper Executable
        working-directory: "./server"
        run: chmod +x mvnw

      - name: Run Lint and Build Validation
        working-directory: "./server"
        run: ./mvnw spotless:check

  fast_tests:
    name: Light Weight Tests
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "server/pom.xml"

      - name: Make Maven Wrapper Executable
        working-directory: "./server"
        run: chmod +x mvnw

      - name: Executar Lint e Validação de Estilo (Spotless, Checkstyle, Enforcer)
        working-directory: "./server"
        run: ./mvnw validate

      - name: Run Unit Tests
        working-directory: "./server"
        run: ./mvnw test

  slow_tests:
    name: Testes Lentos (Integration & SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: "server/pom.xml"

      - name: Make Maven Wrapper Executable
        working-directory: "./server"
        run: chmod +x mvnw

      - name: Run Integration Tests
        working-directory: "./server"
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./mvnw verify -Dskip.unit.tests=true

      - name: Run SAST (SpotBugs)
        working-directory: "./server"
        run: ./mvnw spotbugs:check

  build_image:
    name: Build da Imagem Docker
    needs: [fast_tests, slow_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup Docker Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          tags: ${{ env.IMAGE_NAME }}
          push: false
          outputs: type=docker,dest=/tmp/server-image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: /tmp/server-image.tar

  docker_image_scan:
    name: Scan da imagem Docker
    needs: build_image
    runs-on: ubuntu-latest
    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker Image
        run: docker load -i /tmp/server-image.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  #===============
  # CD (AWS via OIDC)
  #===============
  aws_environment:
    name: Ambiente AWS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      configured: ${{ steps.config.outputs.configured }}
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - name: Verificar configuração da AWS
        id: config
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS não configurada (variável AWS_ROLE_ARN vazia): publicação e deploy ignorados. Veja infra/README.md."
          fi

      - name: Configurar credenciais AWS (OIDC)
        if: steps.config.outputs.configured == 'true' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Decidir se o ambiente é atualizado
        id: decision
        if: steps.config.outputs.configured == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif output=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query cluster.status --output text 2>&1); then
            if [ "$output" = "ACTIVE" ]; then
              echo "Cluster $EKS_CLUSTER_NAME no ar ($output): o ambiente será atualizado."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Cluster $EKS_CLUSTER_NAME em transição ($output): o push só publica a imagem."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q ResourceNotFoundException <<< "$output"; then
            echo "::notice::Ambiente AWS desligado: o push só publica a imagem. Rode este workflow manualmente para subir o ambiente."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            exit 1
          fi

  publish_image:
    name: Publicação da Imagem (ECR)
    needs: [docker_image_scan, aws_environment]
    if: needs.aws_environment.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker Image
        run: docker load -i /tmp/server-image.tar

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Publicar imagem com a tag do commit
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          docker tag "$IMAGE_NAME" "$ECR_REPOSITORY_URL:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"

  provision:
    name: Infraestrutura e Banco de Dados (Terraform)
    needs: [fast_tests, slow_tests, aws_environment]
    if: needs.aws_environment.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: aws-environment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_cluster_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
    outputs:
      alb_dns: ${{ steps.outputs.outputs.alb_dns }}
      db_host: ${{ steps.outputs.outputs.db_host }}
      db_username: ${{ steps.outputs.outputs.db_username }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar secrets obrigatórios
        run: |
          : "${TF_VAR_db_password:?Defina o secret DB_PASSWORD no repositório (infra/README.md)}"

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var="cluster_name=$EKS_CLUSTER_NAME"

      - name: Terraform Apply (VPC, EKS, RDS e ALB)
        run: terraform apply tfplan

      - name: Exportar saídas
        id: outputs
        run: |
          {
            echo "alb_dns=$(terraform output -raw alb_dns)"
            echo "db_host=$(terraform output -raw db_host)"
            echo "db_username=$(terraform output -raw db_username)"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy no Kubernetes (EKS)
    needs: [publish_image, provision]
    runs-on: ubuntu-latest
    concurrency:
      group: aws-environment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      EKS_IMAGE_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
      EKS_IMAGE_TAG: ${{ github.sha }}
      EKS_ALB_DNS: ${{ needs.provision.outputs.alb_dns }}
      EKS_DB_HOST: ${{ needs.provision.outputs.db_host }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configurar acesso ao cluster
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl apply -f k8s/base/namespace.yaml

      - name: Criar Secret da aplicação
        env:
          DB_USERNAME: ${{ needs.provision.outputs.db_username }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ vars.KEYCLOAK_ADMIN || 'admin' }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          : "${KEYCLOAK_ADMIN_PASSWORD:?Defina o secret KEYCLOAK_ADMIN_PASSWORD no repositório (infra/README.md)}"
          secrets_file="$RUNNER_TEMP/jacafi-secrets.env"
          (umask 077 && printf 'DB_USERNAME=%s\nDB_PASSWORD=%s\nKEYCLOAK_ADMIN=%s\nKEYCLOAK_ADMIN_PASSWORD=%s\nRESEND_API_KEY=%s\n' \
            "$DB_USERNAME" "$DB_PASSWORD" "$KEYCLOAK_ADMIN" "$KEYCLOAK_ADMIN_PASSWORD" "$RESEND_API_KEY" > "$secrets_file")
          kubectl -n jacafi create secret generic jacafi-secrets --from-env-file="$secrets_file" --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$secrets_file"

      - name: Criar ConfigMaps do realm e do certificado do RDS
        run: |
          kubectl -n jacafi create configmap keycloak-realm --from-file=jacafi-realm.json=keycloak/jacafi-realm.json --dry-run=client -o yaml | kubectl apply -f -
          curl -fsSL --retry 3 https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o "$RUNNER_TEMP/global-bundle.pem"
          kubectl -n jacafi create configmap rds-ca --from-file=global-bundle.pem="$RUNNER_TEMP/global-bundle.pem" --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifestos (overlay eks)
        env:
          EKS_RESEND_FROM: ${{ vars.RESEND_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$EKS_RESEND_FROM" ]; then
            export EKS_RESEND_ENABLED=true
          else
            export EKS_RESEND_ENABLED=false
          fi
          # A substituição é feita nos arquivos do overlay, antes do kustomize, para os valores
          # entre aspas continuarem strings no YAML gerado (ex.: RESEND_ENABLED: "true").
          work="$RUNNER_TEMP/k8s"
          rm -rf "$work" && cp -r k8s "$work"
          # shellcheck disable=SC2016 # a lista do envsubst é literal de propósito
          for file in "$work"/overlays/eks/*.yaml; do
            envsubst '${EKS_IMAGE_REPOSITORY} ${EKS_IMAGE_TAG} ${EKS_ALB_DNS} ${EKS_DB_HOST} ${EKS_RESEND_ENABLED} ${EKS_RESEND_FROM}' \
              < "$file" > "$file.rendered"
            mv "$file.rendered" "$file"
          done
          kubectl kustomize "$work/overlays/eks" > "$RUNNER_TEMP/eks.yaml"
          if grep -n '[$]{EKS_' "$RUNNER_TEMP/eks.yaml"; then
            echo "::error::Há placeholders do overlay eks sem valor."
            exit 1
          fi
          kubectl apply -f "$RUNNER_TEMP/eks.yaml"

      - name: Aguardar rollout
        run: |
          kubectl -n jacafi rollout status deployment/keycloak --timeout=600s
          kubectl -n jacafi rollout status deployment/api --timeout=600s
          kubectl -n jacafi get pods,services,hpa

      - name: Smoke test pelo ALB
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS "http://$EKS_ALB_DNS/actuator/health/readiness"; then
              curl -fsS -o /dev/null "http://$EKS_ALB_DNS:8080/realms/jacafi"
              exit 0
            fi
            echo "Tentativa $attempt: ALB ainda sem destino saudável."
            sleep 15
          done
          echo "::error::A API não respondeu pelo ALB."
          exit 1

      - name: Resumo do ambiente
        run: |
          {
            echo "### Ambiente AWS no ar"
            echo ""
            echo "| Recurso | Endereço |"
            echo "|---|---|"
            echo "| API | http://$EKS_ALB_DNS |"
            echo "| Keycloak | http://$EKS_ALB_DNS:8080 |"
            echo "| Issuer | http://$EKS_ALB_DNS:8080/realms/jacafi |"
            echo "| Imagem | $EKS_IMAGE_REPOSITORY:$EKS_IMAGE_TAG |"
            echo "| E-mails de status | $(kubectl -n jacafi get configmap jacafi-config -o jsonpath='{.data.RESEND_ENABLED}') |"
            echo ""
            echo "Derrube o ambiente com o workflow **Derrubar ambiente AWS** ao terminar."
          } >> "$GITHUB_STEP_SUMMARY"
