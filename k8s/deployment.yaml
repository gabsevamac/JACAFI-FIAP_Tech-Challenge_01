apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-api
  namespace: jacafi
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tech-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tech-api
    spec:
      containers:
        - name: tech-api
          image: jacafi-tech:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: tech-api-config
            - secretRef:
                name: tech-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
