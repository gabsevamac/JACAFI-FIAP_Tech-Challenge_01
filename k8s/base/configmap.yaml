apiVersion: v1
kind: ConfigMap
metadata:
  name: jacafi-config
data:
  DB_NAME: jacafi
  DB_HOST: database.example.invalid
  DB_PORT: "5432"
  DB_URL: jdbc:postgresql://database.example.invalid:5432/jacafi
  SERVER_PORT: "8082"
  KEYCLOAK_ISSUER_URI: https://auth.example.invalid/realms/jacafi
  KEYCLOAK_JWK_SET_URI: https://auth.example.invalid/realms/jacafi/protocol/openid-connect/certs
  SPRINGDOC_API_DOCS_ENABLED: "true"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
  RESEND_ENABLED: "false"
  RESEND_FROM: ""
  TZ: UTC
