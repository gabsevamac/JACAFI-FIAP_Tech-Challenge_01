apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/postgresql/certs
              readOnly: true
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca
            items:
              - key: global-bundle.pem
                path: global-bundle.pem
