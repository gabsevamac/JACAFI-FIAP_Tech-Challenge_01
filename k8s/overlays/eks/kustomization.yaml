apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jacafi
resources:
  - ../../base
  - ingress.yaml
components:
  - ../../components/autoscaling
images:
  - name: jacafi/server
    newName: registry.example.invalid/jacafi/server
    newTag: replace-with-release-tag
patches:
  - path: configmap.yaml
  - path: api.yaml
