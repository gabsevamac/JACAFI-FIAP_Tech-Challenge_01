apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jacafi
resources:
  - ../../base
components:
  - ../../components/keycloak
  - ../../components/autoscaling
images:
  - name: jacafi/server
    newName: ${EKS_IMAGE_REPOSITORY}
    newTag: "${EKS_IMAGE_TAG}"
patches:
  - path: configmap.yaml
  - path: api.yaml
  - path: keycloak.yaml
  - path: service-api.yaml
  - path: service-keycloak.yaml
