services:
  database:
    image: postgres:16-alpine
    container_name: database
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # As duas variaveis existem porque atendem coisas diferentes, e so as duas juntas
      # fecham o cerco: TZ e o fuso do sistema operacional do container (o que `date` e o
      # log do Postgres usam), PGTZ e o fuso que o cliente libpq assume na sessao.
      #
      # A aplicacao mede tempo medio de execucao de servico, que e subtracao entre
      # timestamps. Se o banco resolver "agora" num fuso e a JVM em outro, a conta erra por
      # um numero inteiro de horas — e erra silenciosamente, porque o resultado continua
      # sendo um numero plausivel.
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - tech-network

  server:
    container_name: server
    build: ./server
    ports:
      # application.yaml define server.port com default 8082, entao a aplicacao escuta na 8082
      # dentro do container. Mantido igual no host para nao haver dois numeros em jogo.
      - "8082:8082"
    networks:
      - tech-network
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Obrigatorio: application.yaml resolve ${JWT_SECRET} na subida do contexto e,
      # sem a variavel, o container nao inicia. Minimo de 32 bytes para HS256.
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      database:
        condition: service_healthy

volumes:
  pgdata:

networks:
  tech-network:
    driver: bridge
