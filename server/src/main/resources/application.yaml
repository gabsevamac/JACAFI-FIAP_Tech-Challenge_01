spring:
  application:
    name: tech
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # SQL no log carrega o valor dos parametros ligados, e entre eles estao placa e CPF. Fica
    # desligado por padrao; quem precisar depurar liga no perfil local, nunca em producao.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          # Fuso que o Hibernate usa ao passar e ao ler timestamp pelo JDBC.
          #
          # Sem esta linha o driver usa o fuso default da JVM, e o valor gravado passa a
          # depender da maquina que rodou a aplicacao. Nao e teorico: a mesma linha lida por
          # um container em UTC e por um desenvolvedor em America/Sao_Paulo daria dois
          # instantes diferentes, e nenhum erro seria levantado.
          #
          # Fixar aqui torna o comportamento independente do ambiente, que e o que permite
          # ao teste de integracao provar o round-trip do Instant.
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8082}
  error:
    # Endurecimento do tratador de erro padrao do container, que responde /error quando algo
    # escapa do @RestControllerAdvice. Todos ja sao o default do Boot; ficam explicitos porque
    # sao decisao de seguranca, e um default silencioso pode mudar entre versoes sem ninguem notar.
    #
    # include-message=never vale ate para 4xx: as mensagens do dominio sao escritas para quem le o
    # log — "vehicleId must not be null" — e nao para o cliente.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    # Sem esta linha, uma requisicao a uma rota inexistente devolve um corpo com o caminho
    # tentado e a whitelabel page.
    whitelabel:
      enabled: false

logging:
  pattern:
    # O traceId acompanha cada linha. E o que liga a resposta opaca que o cliente recebeu ao
    # detalhe completo que so o log tem — sem ele o identificador na resposta nao serve para nada.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId:-no-trace}] --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    # O Postgres inclui o valor do campo na mensagem de violacao de constraint
    # ("Detail: Key (license_plate)=(ABC1D23) already exists"), e o Hibernate registra essa
    # mensagem em WARN. Isso colocaria a placa completa no log por um caminho que nao passa pelo
    # mascaramento da aplicacao, contra o Art. 6 VII da LGPD.
    #
    # A violacao em si ja e tratada: a camada de aplicacao verifica a placa antes de gravar, e o
    # adaptador traduz a constraint em erro de dominio, respondendo 409. O que se perde aqui e a
    # visibilidade de OUTROS avisos de SQL, e isso e um custo real — a alternativa seria indexar
    # um digest da placa em vez do valor, ao custo de complexidade no schema.
    org.hibernate.orm.jdbc.error: ERROR

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 60
